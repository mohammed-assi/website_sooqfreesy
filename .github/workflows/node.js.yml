name: Node.js CI

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Create .env file
      run: |
        echo "${{ secrets.DOTENV_FILE }}" > .env

    - name: Print Node.js version
      run: |
        node -v
        npm -v

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build --if-present

    - name: Setup SSH
      run: |
        echo "Setting up SSH key..."
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

    - name: Clean old files on server
      run: |
        ssh -i ~/.ssh/id_rsa -p ${{ secrets.DEPLOY_PORT || 22 }} ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
          rm -rf /var/www/html/driveX_v1_intial/admin/*
          echo "🧹 Old files removed."
        EOF

    - name: Upload build with scp
      run: |
        scp -i ~/.ssh/id_rsa -P ${{ secrets.DEPLOY_PORT || 22 }} -r dist/* ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/html/driveX_v1_intial/admin/
        echo "🚀 Build deployed to server."
